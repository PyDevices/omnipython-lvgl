name: Linux integration

# Documentation-only changes can't change this result, so they don't run it.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_call:
    inputs:
      ref:
        description: Exact commit or tag to validate
        required: false
        type: string

permissions:
  contents: read

# Each port is built the way a person builds it: this repository and an
# upstream checkout side by side, then upstream's own make. MicroPython takes
# ports/micropython/manifest.py (its c_module() line names the usermod);
# CircuitPython 11 takes ports/circuitpython as a user C module
# (USER_C_MODULES), with no patches to its tree. Both read the generated
# binding, lv_conf.h and lvgl from this checkout.
jobs:
  embedded-unix:
    name: ${{ matrix.runtime }} Unix build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runtime: [micropython, circuitpython]
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7
        with:
          path: integration/omnipython-lvgl
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive

      - name: Check out MicroPython v1.29.0
        if: matrix.runtime == 'micropython'
        uses: actions/checkout@v7
        with:
          repository: micropython/micropython
          ref: v1.29.0
          path: integration/micropython

      - name: Check out CircuitPython 11.0.0-alpha.1
        if: matrix.runtime == 'circuitpython'
        uses: actions/checkout@v7
        with:
          repository: adafruit/circuitpython
          ref: 11.0.0-alpha.1
          path: integration/circuitpython

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev pkg-config

      - name: Build MicroPython Unix
        if: matrix.runtime == 'micropython'
        working-directory: integration/micropython
        # c_module() in the port's manifest needs micropython-lib in the
        # tree; the rest of the port's submodules come from `make submodules`.
        run: |
          git submodule update --init lib/micropython-lib
          make -C mpy-cross -j"$(nproc)"
          make -C ports/unix submodules
          make -C ports/unix -j"$(nproc)" FROZEN_MANIFEST="$GITHUB_WORKSPACE/integration/omnipython-lvgl/ports/micropython/manifest.py"

      - name: Smoke MicroPython Unix
        if: matrix.runtime == 'micropython'
        working-directory: integration
        run: ./micropython/ports/unix/build-standard/micropython ./omnipython-lvgl/tools/test_lvgl_smoke.py

      - name: Fetch CircuitPython submodules
        if: matrix.runtime == 'circuitpython'
        working-directory: integration/circuitpython
        # The unix build needs extmod/ulab, tools/huffman, and the lib/
        # submodules; 'tests' is upstream CI's unix target.
        run: |
          python -m pip install -r requirements-dev.txt
          python tools/ci_fetch_deps.py tests

      - name: Build CircuitPython Unix
        if: matrix.runtime == 'circuitpython'
        working-directory: integration
        run: |
          make -C circuitpython/mpy-cross -j"$(nproc)"
          make -C circuitpython/ports/unix -j"$(nproc)" VARIANT=coverage \
              USER_C_MODULES="$GITHUB_WORKSPACE/integration/omnipython-lvgl/ports/circuitpython" \
              FROZEN_MANIFEST="$GITHUB_WORKSPACE/integration/omnipython-lvgl/ports/circuitpython/manifest.py"

      - name: Smoke CircuitPython Unix
        if: matrix.runtime == 'circuitpython'
        working-directory: integration
        run: ./circuitpython/ports/unix/build-coverage/micropython ./omnipython-lvgl/tools/test_lvgl_smoke.py

  cpython:
    name: CPython extension build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the extension
        run: python -m pip install -e .

      - name: Extension tests
        run: python -m unittest discover -s ports/cpython/tests -v

      - name: Smoke
        run: python tools/test_lvgl_smoke.py
